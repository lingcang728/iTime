name: Immutable Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      ITIME_BROWSER_CHANNEL: chrome

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reuse runner Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Install locked project dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright --version

      - name: Validate immutable tag and versions
        shell: pwsh
        run: |
          ./scripts/verify-release-tag.ps1 `
            -TagName '${{ github.ref_name }}' `
            -RequireTagAtHead `
            -RequireCleanSource
          gh release view '${{ github.ref_name }}' *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            throw '该标签已经存在 GitHub Release，拒绝覆盖。'
          }

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build release from clean checkout
        run: npm run package:release

      - name: Upload synthetic visual failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-visual-failure-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

      - name: Verify clean release manifest
        shell: pwsh
        run: ./scripts/verify-release-manifest.ps1 -RequireCleanSource

      - name: Create immutable GitHub Release
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'release/release-manifest.json' -Raw | ConvertFrom-Json
          $installer = "release/iTime_$($manifest.version)_x64-setup.exe"
          gh release create '${{ github.ref_name }}' `
            --verify-tag `
            --title "iTime ${{ github.ref_name }}" `
            --generate-notes `
            'release/iTime.exe' `
            $installer

      - name: Re-download and verify published assets
        shell: pwsh
        run: |
          $download = 'output/release-download'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download '${{ github.ref_name }}' --pattern '*.exe' --dir $download
          ./scripts/verify-release-assets.ps1 `
            -ManifestPath 'release/release-manifest.json' `
            -AssetsDirectory $download `
            -RequireCleanSource
