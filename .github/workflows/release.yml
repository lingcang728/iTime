name: Immutable Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      ITIME_BROWSER_CHANNEL: chrome
      RUST_BACKTRACE: "1"
      RUST_TEST_THREADS: "1"
      ITIME_CI_VISUAL_RELAXED: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Reuse runner Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version

      # F-14 supply-chain gate: releases must not ship crates with known
      # vulnerabilities. `cargo install` output is cached by rust-cache.
      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/Cargo.lock)) { cargo generate-lockfile --manifest-path src-tauri/Cargo.toml }
          cargo install cargo-audit --locked
          Push-Location src-tauri
          try { cargo audit } finally { Pop-Location }

      - name: Install locked project dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright --version
          if (-not (Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe') -and
              -not (Test-Path 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe')) {
            python -m playwright install chromium
          }

      - name: Validate immutable tag and versions
        id: validate
        shell: pwsh
        run: |
          ./scripts/verify-release-tag.ps1 `
            -TagName '${{ github.ref_name }}' `
            -RequireTagAtHead `
            -RequireCleanSource
          gh release view '${{ github.ref_name }}' *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            # Local package:release / gh release create already published this tag.
            # Do not fail the workflow (that spams failure emails); just skip rebuild.
            Write-Host "Release ${{ github.ref_name }} already exists — skipping immutable rebuild (no overwrite)."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      # package:release runs the full gate chain in order: `npm run verify`
      # (unit + IPC contract + build + audits + cargo) -> tauri build ->
      # transactional asset copy with SHA-256 -> manifest + latest.json ->
      # native WebView2/IPC smoke + native visual baseline on the packaged EXE.
      # -SkipLocalDeploy keeps the runner from touching a desktop shortcut it
      # does not have (CI auto-skips too).
      - name: Build release from clean checkout
        if: steps.validate.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/package-release.ps1 -SkipLocalDeploy

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-failure-evidence-${{ github.run_id }}
          path: |
            artifacts/visual/
            artifacts/native-qa/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

      - name: Verify clean release manifest
        if: steps.validate.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/verify-release-manifest.ps1 -RequireCleanSource

      - name: Create immutable GitHub Release
        if: steps.validate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'release/release-manifest.json' -Raw | ConvertFrom-Json
          $installer = "release/iTime_$($manifest.version)_x64-setup.exe"
          gh release create '${{ github.ref_name }}' `
            --verify-tag `
            --title "iTime ${{ github.ref_name }}" `
            --generate-notes `
            'release/iTime.exe' `
            $installer `
            'release/latest.json'

      - name: Re-download and verify published assets
        if: steps.validate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $download = 'output/release-download'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download '${{ github.ref_name }}' --pattern '*.exe' --pattern 'latest.json' --dir $download
          ./scripts/verify-release-assets.ps1 `
            -ManifestPath 'release/release-manifest.json' `
            -AssetsDirectory $download `
            -RequireCleanSource `
            -CheckLatestEndpoint
