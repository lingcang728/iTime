name: Immutable Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      ITIME_BROWSER_CHANNEL: chrome
      RUST_BACKTRACE: "1"
      RUST_TEST_THREADS: "1"
      ITIME_CI_VISUAL_RELAXED: "1"
      ITIME_TELEMETRY_ENDPOINT: ${{ secrets.ITIME_TELEMETRY_ENDPOINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reuse runner Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Install locked project dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright --version
          if (-not (Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe') -and
              -not (Test-Path 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe')) {
            python -m playwright install chromium
          }

      - name: Validate immutable tag and versions
        id: validate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ITIME_TELEMETRY_ENDPOINT) -or
              $env:ITIME_TELEMETRY_ENDPOINT -notmatch '^https://') {
            throw 'ITIME_TELEMETRY_ENDPOINT secret is missing or is not HTTPS.'
          }
          ./scripts/verify-release-tag.ps1 `
            -TagName '${{ github.ref_name }}' `
            -RequireTagAtHead `
            -RequireCleanSource
          gh release view '${{ github.ref_name }}' *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            # Local package:release / gh release create already published this tag.
            # Do not fail the workflow (that spams failure emails); just skip rebuild.
            Write-Host "Release ${{ github.ref_name }} already exists — skipping immutable rebuild (no overwrite)."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Audit production dependencies
        if: steps.validate.outputs.skip != 'true'
        run: npm run audit:prod

      - name: Build release from clean checkout
        if: steps.validate.outputs.skip != 'true'
        run: npm run package:release

      - name: Upload synthetic visual failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-visual-failure-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

      - name: Verify clean release manifest
        if: steps.validate.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/verify-release-manifest.ps1 -RequireCleanSource

      - name: Create immutable GitHub Release
        if: steps.validate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'release/release-manifest.json' -Raw | ConvertFrom-Json
          $installer = "release/iTime_$($manifest.version)_x64-setup.exe"
          gh release create '${{ github.ref_name }}' `
            --verify-tag `
            --title "iTime ${{ github.ref_name }}" `
            --generate-notes `
            'release/iTime.exe' `
            $installer `
            'release/latest.json'

      - name: Re-download and verify published assets
        if: steps.validate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $download = 'output/release-download'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download '${{ github.ref_name }}' --pattern '*.exe' --pattern 'latest.json' --dir $download
          ./scripts/verify-release-assets.ps1 `
            -ManifestPath 'release/release-manifest.json' `
            -AssetsDirectory $download `
            -RequireCleanSource
