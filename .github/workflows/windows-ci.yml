name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      ITIME_BROWSER_CHANNEL: chrome
      RUST_BACKTRACE: "1"
      # Serial cargo tests: host COM probes used to abort the whole process (0xC00000FF).
      RUST_TEST_THREADS: "1"
      # Visual regression is intentional-gate on baseline commits; slight CI font/DPI noise is ignored.
      ITIME_CI_VISUAL_RELAXED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Reuse runner Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version

      # F-14 supply-chain gate: audit the committed Cargo.lock for known
      # vulnerabilities. `cargo install` output is cached by rust-cache.
      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/Cargo.lock)) { cargo generate-lockfile --manifest-path src-tauri/Cargo.toml }
          cargo install cargo-audit --locked
          Push-Location src-tauri
          try { cargo audit } finally { Pop-Location }

      - name: Install locked project dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright --version
          # Prefer system Chrome via channel; fall back to Chromium if channel launch fails later.
          if (-not (Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe') -and
              -not (Test-Path 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe')) {
            python -m playwright install chromium
          }

      # Gate order: unit tests -> IPC contract check -> build -> website audit ->
      # prod dep audit -> cargo fmt/clippy/test (all inside `npm run verify`).
      # The real-app gates (native WebView2/IPC smoke + native visual baseline)
      # run inside `npm run package:release` on the freshly packaged EXE — CI
      # has no packaged artifact here, so verify:full is intentionally not used.
      - name: Run verification gate
        run: npm run verify

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-evidence-${{ github.run_id }}
          path: |
            artifacts/visual/
            artifacts/native-qa/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
