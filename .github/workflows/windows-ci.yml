name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      ITIME_BROWSER_CHANNEL: chrome

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reuse runner Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Install locked project dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright --version

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run full verification gate
        run: npm run verify:full

      - name: Upload synthetic visual failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-failure-${{ github.run_id }}
          path: artifacts/visual/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
