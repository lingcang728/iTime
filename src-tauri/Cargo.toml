[package]
name = "itime"
version = "0.3.2"
description = "A local-first screen time and AI work prototype"
authors = ["iTime"]
edition = "2021"

[lib]
name = "itime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# `devtools` stays OFF the default feature set on purpose: a scriptable console
# in a release build turns every custom command (consent toggle, export,
# delete-all) into a social-engineering target. Local debugging opts in via
# `cargo tauri dev --features devtools` (wired into `npm run tauri:dev`).
[features]
devtools = ["tauri/devtools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }
